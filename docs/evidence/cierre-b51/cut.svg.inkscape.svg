    <filter
       id="fep-shadow"
       x="-50%"
       y="-50%"
       width="200%"
       height="200%">
      <feGaussianBlur
         in="SourceAlpha"
         stdDeviation="1.5"
         result="blur"
         id="feGaussianBlur1" />
      <feOffset
         in="blur"
         dx="2"
         dy="2"
         result="offset"
         id="feOffset1" />
      <feFlood
         flood-color="#000000"
         flood-opacity=".3"
         result="shade"
         id="feFlood1" />
      <feComposite
         in="shade"
         in2="offset"
         operator="in"
         result="shadow"
         id="feComposite1" />
      <feMerge
         id="feMerge2">
        <feMergeNode
           in="shadow"
           id="feMergeNode1" />
        <feMergeNode
           in="SourceGraphic"
           id="feMergeNode2" />
      </feMerge>
    </filter>
  </defs>
