name: FEP Editor PRO — Android emulator diagnostic
on:
  workflow_dispatch:
  push:
    branches:
      - desarrollo/android-cierre-c
    paths:
      - '.github/workflows/android-emulator-diagnostic.yml'
      - 'scripts/android-emulator-smoke.sh'
      - 'scripts/android-emulator-functional.mjs'
      - 'scripts/android-cdp-functional.mjs'
      - 'app.js'
      - 'src/**'
      - 'scripts/native-bridge-entry.js'
      - 'scripts/android-native/**'
concurrency:
  group: fep-editor-emulator
  cancel-in-progress: true
jobs:
  emulator-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare offline application
        run: |
          set -euo pipefail
          python3 scripts/build-mobile-web.py
      - name: Install Capacitor and Android plugins
        run: |
          set -euo pipefail
          npm install --save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/camera@8 @capacitor/filesystem@8 @capacitor/share@8 esbuild@0.25.12
          ./node_modules/.bin/esbuild scripts/native-bridge-entry.js --bundle --platform=browser --format=iife --outfile=mobile-www/fep-native.js
          npx cap add android
          cp scripts/android-native/*.java android/app/src/main/java/com/fep/editorpro/
          npx cap sync android
          python3 scripts/android-native/patch-manifest.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          plugins=json.loads(Path('android/app/src/main/assets/capacitor.plugins.json').read_text())
          installed={p.get('pkg') for p in plugins}
          required={'@capacitor/camera','@capacitor/filesystem','@capacitor/share'}
          assert required.issubset(installed),(installed,required)
          print('Native Capacitor plugins confirmed:',sorted(installed))
          PY
      - name: Compile debug APK
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Reclaim runner disk after compilation
        run: |
          set -euo pipefail
          echo "Free disk BEFORE cleanup:"
          df -h "$HOME" /
          # Disposable GitHub hosted runner: these toolchains are not used by the
          # compiled Android APK, KVM emulator or ADB diagnostic.
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake
          rm -rf "$HOME/.gradle/caches" "$HOME/.npm/_cacache"
          sudo apt-get clean
          echo "Free disk AFTER cleanup:"
          df -h "$HOME" /
          free_kb=$(df -Pk "$HOME" | awk 'NR==2 {print $4}')
          if [ "$free_kb" -lt 10500000 ]; then
            echo "::error::Need at least 10 GB available for emulator userdata and system image"
            exit 1
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, open, and diagnose on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 360
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -partition-size 2048 -camera-back emulated -camera-front emulated
          script: bash scripts/android-emulator-smoke.sh && node scripts/android-cdp-functional.mjs
      - name: Upload screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fep-editor-emulator-diagnostics
          if-no-files-found: warn
          path: |
            emulator-evidence/**
            android/app/build/outputs/apk/debug/app-debug.apk
