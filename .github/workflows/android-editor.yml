name: FEP Editor PRO — Android Premium P6 audit
concurrency:
  group: fep-editor-android-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches:
      - desarrollo/estudio3d-premium-p6-auditoria
    paths:
      - 'capacitor.config.json'
      - 'scripts/build-mobile-web.py'
      - '.github/workflows/android-editor.yml'
      - 'index.html'
      - 'app.js'
      - 'plancha.js'
      - 'src/**'
      - 'vendor/**'
      - 'scripts/native-bridge-entry.js'
      - 'scripts/android-native/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
jobs:
  android-debug:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -x "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools/adb"
          echo "Android SDK: ${ANDROID_HOME}"
      # Internal debug builds only. Not for production releases.
      - name: Restore Android test signing certificate
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fep-editor-pro-android-debug-key-v1
      # A stable debug keystore can be provided via Repository Secrets across branches.
      # No secret means a branch-local testing signature; NEVER assume in-place upgrade.
      - name: Load stable Android test keystore when configured
        shell: bash
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$TEST_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$TEST_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
            echo "Stable debug signing certificate loaded from secrets."
          else
            echo "::warning::No shared test certificate configured: builds across branches can have different signatures. Back up projects before reinstalling."
          fi
      - name: Initialize signing certificate if missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Install JavaScript test dependencies
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Finalize offline asset hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/finalize-offline.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('offline-manifest.json').read_text())
          assert manifest['build'].startswith('fep-')
          assert len(manifest['files'])>0
          print('Offline bundle manifest:',manifest['build'],len(manifest['files']))
          PY
      - name: Run full Node unit regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm test
      - name: Check photo tools and editor JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check src/premium-p4.js
          node --check src/premium-p5.js
          node --check src/premium-p6.js
          node --check src/creative-controls.js
          node --check scripts/native-bridge-entry.js
          node --check src/photo-tools.js
          node --check src/photo-import-mobile.js
          node --test tests/premium-p6.test.mjs tests/premium-p5.test.mjs tests/premium-p4.test.mjs tests/core.test.mjs tests/photo-tools.test.mjs tests/photo-import-mobile.test.mjs tests/android-project-reopen.test.mjs tests/premium-3d.test.mjs tests/premium-3d-p2.test.mjs
      - name: Prepare bundled offline web assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-mobile-web.py
      - name: Install Capacitor 8 (CI only)
        shell: bash
        run: |
          set -euo pipefail
          npm install --save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/camera@8 @capacitor/app@8 @capacitor/filesystem@8 @capacitor/share@8 esbuild@0.25.12
          ./node_modules/.bin/esbuild scripts/native-bridge-entry.js --bundle --platform=browser --format=iife --outfile=mobile-www/fep-native.js
          npx cap --version
      - name: Create Android project from bundled assets
        shell: bash
        run: |
          set -euo pipefail
          npx cap add android
          cp scripts/android-native/*.java android/app/src/main/java/com/fep/editorpro/
          npx cap sync android
          # Advance Android versionCode for install-over-install compatibility.
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          path=Path('android/app/build.gradle')
          value=path.read_text()
          code=1000+int(os.environ['GITHUB_RUN_NUMBER'])
          updated,count=re.subn(r'(?m)^([ \t]*versionCode[ \t]+)\d+[ \t]*$',lambda m:m.group(1)+str(code),value)
          if count != 1:
              raise SystemExit('Cannot uniquely update Android versionCode')
          value=updated
          updated,count=re.subn(r'(?m)^([ \t]*versionName[ \t]+).+$',lambda m:m.group(1)+'"0.9.6-p6"',value)
          if count != 1:
              raise SystemExit('Cannot uniquely update Android versionName')
          path.write_text(updated)
          print('Android versionCode:',code,'versionName: 0.9.6-p6')
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('android/app/src/main/assets/capacitor.plugins.json')
          if not path.is_file():
              raise SystemExit('Plugin manifest missing: Capacitor plugins not installed')
          plugins=json.loads(path.read_text())
          registered={item.get('pkg') for item in plugins}
          expected={'@capacitor/camera','@capacitor/app','@capacitor/filesystem','@capacitor/share'}
          print('Registered plugins:', sorted(registered))
          if not expected.issubset(registered):
              raise SystemExit('Missing native plugins: '+', '.join(sorted(expected-registered)))
          PY
          python3 scripts/android-native/patch-manifest.py
          grep -q 'android.media.action.IMAGE_CAPTURE' android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.GET_CONTENT' android/app/src/main/AndroidManifest.xml
      - name: Compile Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug 2>&1 | tee ../android-build.log
      - name: Build signed release APK and Play App Bundle when secrets exist
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64$ANDROID_KEYSTORE_PASS$ANDROID_KEY_ALIAS$ANDROID_KEY_PASS" ]; then
            echo "Release signing not configured; debug APK only."
            exit 0
          fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASS" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASS" ]; then
            echo "::error::Partial release signing configuration. Supply all four secrets."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/fep-release.keystore
          chmod 600 android/app/fep-release.keystore
          keytool -list -keystore android/app/fep-release.keystore -storepass "$ANDROID_KEYSTORE_PASS" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          content=p.read_text()
          content += """
          android {
              signingConfigs {
                  fepProduction {
                      storeFile file('fep-release.keystore')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASS')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASS')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.fepProduction
                  }
              }
          }
          """
          p.write_text(content)
          PY
          cd android
          ./gradlew --no-daemon assembleRelease bundleRelease 2>&1 | tee ../android-release-build.log
          cd ..
          test -s android/app/build/outputs/apk/release/app-release.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
          sha256sum android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/bundle/release/app-release.aab > release-checksums.sha256
          rm -f android/app/fep-release.keystore
      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | grep -q 'classes.dex'
          unzip -l "$apk" | grep -q 'AndroidManifest.xml'
          sha256sum "$apk" > app-debug.apk.sha256
      - name: Upload signed release artifacts if configured
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fep-editor-pro-p6-signed-release
          if-no-files-found: ignore
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            release-checksums.sha256
            android-release-build.log
      - name: Upload debug APK and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fep-editor-pro-android-debug
          if-no-files-found: warn
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
            android-build.log
            offline-manifest.json
